name: bloodonor
description: "Emergency Blood Donor App — Real-time emergency blood donor matching platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.0

  # Firebase
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0

  # Maps
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0
  geocoding: ^4.0.0

  # Navigation
  go_router: ^14.8.0

  # State management
  provider: ^6.1.0

  # Environment config
  flutter_dotenv: ^5.2.0

  # Utilities
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  intl: ^0.20.0
  uuid: ^4.5.0
  pdf: ^3.11.0
  path_provider: ^2.1.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
