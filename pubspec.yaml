name: bloodonor
description: "Emergency Blood Donor App — Real-time emergency blood donor matching platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.0

  # Firebase
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0

  # State management
  provider: ^6.1.0

  # Environment config
  flutter_dotenv: ^5.2.0

  # Utilities
  url_launcher: ^6.3.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # .env must exist before building (copied from .env.example).
    # Only SUPABASE_URL + SUPABASE_ANON_KEY may ever go in it.
    - .env
